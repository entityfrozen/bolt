<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0d0a">
<title>Lightning — Launcher</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#0b0c0e;color:#ececea;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(440px,calc(100% - 30px));padding:24px;border:1px solid #292b30;background:#111214}.head{display:flex;align-items:center;gap:10px;margin-bottom:20px}.mark{width:28px;height:28px}.mark path{fill:#edc477}.head strong{font-size:18px;letter-spacing:-.03em}.label{display:block;margin-bottom:6px;color:#757981;font:600 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}input{width:100%;height:40px;padding:0 10px;border:1px solid #292b30;border-radius:6px;background:#0b0c0e;color:#eee;outline:0}input:focus{border-color:#52565f}.row{display:flex;gap:7px;margin-top:10px}button{height:37px;padding:0 12px;border:1px solid #33363c;border-radius:6px;background:#17191c;color:#c9cbd0;cursor:pointer}button:hover{background:#1d1f23;color:#fff}.primary{border-color:#6d5d2f;background:#2a2415;color:#f2d37c}.note{margin:15px 0 0;color:#62666f;font-size:11px;line-height:1.5}.status{min-height:18px;margin-top:10px;color:#ca8f96;font-size:11px}

body{background:radial-gradient(ellipse at 50% 8%,#342817,#0c0b09 70%);color:#f3e7d3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.box{width:min(490px,calc(100% - 30px));border:1px solid #675031;border-radius:20px;padding:32px;background:linear-gradient(145deg,#292219,#17140f);box-shadow:0 28px 65px #0008,inset 0 1px 0 #ffe4ac12}
.head{gap:15px;margin-bottom:26px}.mark{width:37px;height:37px;filter:drop-shadow(0 2px 12px #c9984b55)}
.head strong{font-size:23px;font-weight:650;letter-spacing:-.06em}
.label{font-size:10px;color:#d1b589;letter-spacing:.13em}
input{height:44px;border-color:#745836;border-radius:10px;padding:0 13px;background:#0c0b09;color:#f8e5c6;font-size:13px}
input:focus{border-color:#dcb477}
.row{margin-top:15px}
button{height:41px;border-color:#5e4932;border-radius:10px;background:#272019;color:#d8bd94;font-weight:570}
button:hover{background:#392c1d}
.primary{color:#1d1509;border:1px solid #f8e2b9;background:linear-gradient(125deg,#f1d79e,#c99a57);font-weight:700}
.primary:hover{background:linear-gradient(125deg,#ffe8ba,#ddb476);color:#1d1509}
.note{color:#9e927d;font-size:11px;line-height:1.6}
.status{font-size:11px;color:#eab8a0}
</style>
</head>
<body>
<main class="box">
  <div class="head"><svg class="mark" viewBox="0 0 64 64"><path d="M35 7 15 35h14l-3 22 23-32H35Z"/></svg><strong>Lightning</strong></div>
  <label class="label" for="url">Hosted URL</label>
  <input id="url" type="url" placeholder="https://lightning.example.com" autocomplete="off" spellcheck="false">
  <div class="row"><button class="primary" id="launch" type="button">Open Lightning</button><button id="save" type="button">Save</button></div>
  <div class="status" id="status"></div>
  <p class="note">This launcher opens the hosted Lightning site in an about:blank window. If your browser blocks embedded service workers, use Lightning's “Open direct” button once.</p>
</main>
<script>
const key="bolt_hosted_url_v1";
const input=document.getElementById("url");
const status=document.getElementById("status");
input.value=localStorage.getItem(key)||"";
function clean(){try{const u=new URL(input.value.trim());if(u.protocol!=="https:"&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(u.origin))throw 0;return u.href.replace(/\/$/,"")}catch{return""}}
function save(){const url=clean();if(!url){status.textContent="Use a valid HTTPS URL.";return""}localStorage.setItem(key,url);input.value=url;status.textContent="Saved.";return url}
function launch(){const url=save();if(!url)return;const win=window.open("about:blank","_blank");if(!win){status.textContent="Popup blocked. Click Open Lightning again after allowing popups.";return}win.document.open();win.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightning</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#0b0c0e}iframe{display:block}</style></head><body><iframe src="${url.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}" allow="fullscreen; clipboard-read; clipboard-write; autoplay; picture-in-picture"></iframe></body></html>`);win.document.close();win.focus()}
document.getElementById("save").addEventListener("click",save);document.getElementById("launch").addEventListener("click",launch);input.addEventListener("keydown",event=>{if(event.key==="Enter")launch()});if(input.value)setTimeout(launch,0);
</script>
</body>
</html>
