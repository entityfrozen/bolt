 <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#fff0ee"/><stop offset=".7" stop-color="#ffe0e1"/><stop offset="1" stop-color="#d8a4bb"/></linearGradient>
 <linearGradient id="eye" x2="0" y2="1"><stop stop-color="#382071"/><stop offset=".45" stop-color="#9b64fe"/><stop offset="1" stop-color="#42bdfe"/></linearGradient>
 <linearGradient id="bolt" x2=".1" y2="1"><stop stop-color="#f9f0ff"/><stop offset=".4" stop-color="#d68cff"/><stop offset="1" stop-color="#6c45ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#120b48" flood-opacity=".6"/></filter>
