<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-label="Lightning-chan, a silver-haired futuristic anime mascot">
<defs>
 <linearGradient id="hair" x2=".9" y2="1"><stop stop-color="#faf5ff"/><stop offset=".42" stop-color="#b9a5ff"/><stop offset=".8" stop-color="#6040a5"/><stop offset="1" stop-color="#2b2266"/></linearGradient>
 <linearGradient id="hair2" x2=".2" y2="1"><stop stop-color="#f4efff"/><stop offset=".6" stop-color="#b7a1f6"/><stop offset="1" stop-color="#5145ab"/></linearGradient>
