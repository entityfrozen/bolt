<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Bolt</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wdth,wght@90..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bolt.css">
<script src="/bootstrap-init.js"></script>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script defer src="/assets/app.js"></script>
</head>
<body class="app-page">
<svg class="icon-sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.3 8.2A8 8 0 0 1 19 10M5 14a8 8 0 0 0 12.7 3.8"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-2v8l-4-2Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1A7 7 0 0 0 14.4 5L14 2h-4l-.4 3a7 7 0 0 0-2.1 1.9l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2.1 1.9l.4 3h4l.4-3a7 7 0 0 0 2.1-1.9l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 6a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 13v6H5V5h6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 2.8 8.5 7 10 4.2-1.5 7-5 7-10V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5H5v11h3"/></symbol>
</svg>

<div class="bolt-shell" id="boltShell">
  <header class="tabbar">
    <button class="bolt-brand" id="homeMark" type="button" title="New tab">
      <svg viewBox="0 0 64 64"><path d="M35 7 15 35h14l-3 22 23-32H35Z"/></svg>
      <span>Bolt</span>
    </button>
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="newTabBtn" type="button" title="New tab"><svg><use href="#i-plus"/></svg></button>
    <div class="account-zone">
      <span class="role-chip" id="roleChip"></span>
      <button class="account-button" id="accountButton" type="button"><span id="accountInitial">B</span></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="nav-cluster">
      <button class="tool-button" id="backBtn" type="button" title="Back"><svg><use href="#i-back"/></svg></button>
      <button class="tool-button" id="forwardBtn" type="button" title="Forward"><svg><use href="#i-forward"/></svg></button>
      <button class="tool-button" id="reloadBtn" type="button" title="Reload"><svg><use href="#i-reload"/></svg></button>
    </div>
    <form class="address-form" id="addressForm">
      <span class="address-state"><svg><use href="#i-lock"/></svg></span>
      <input id="addressInput" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
      <button class="address-go" type="submit">Go</button>
    </form>
    <button class="tool-button" id="bookmarkBtn" type="button" title="Bookmark"><svg><use href="#i-star"/></svg></button>
    <button class="tool-button" id="menuBtn" type="button" title="Menu"><svg><use href="#i-menu"/></svg></button>
  </div>

  <div class="workarea">
    <nav class="rail">
      <button class="rail-button active" data-action="newtab" type="button" title="Home"><svg><use href="#i-home"/></svg></button>
      <button class="rail-button" data-panel="history" type="button" title="History"><svg><use href="#i-clock"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-button" data-panel="video" type="button" title="Video"><svg><use href="#i-video"/></svg></button>
      <button class="rail-button" data-panel="music" type="button" title="Music"><svg><use href="#i-music"/></svg></button>
      <button class="rail-button" data-panel="settings" type="button" title="Settings"><svg><use href="#i-settings"/></svg></button>
      <button class="rail-button admin-only" data-panel="admin" type="button" title="Admin"><svg><use href="#i-users"/></svg></button>
    </nav>

    <main class="browser-stage" id="browserStage">
      <section class="newtab" id="newtabView">
        <div class="newtab-inner">
          <div class="newtab-wordmark"><span class="newtab-bolt">↯</span>BOLT</div>
          <form class="newtab-search" id="newtabForm">
            <svg><use href="#i-search"/></svg>
            <input id="newtabInput" autocomplete="off" spellcheck="false" placeholder="Where to?">
          </form>
          <div class="newtab-lower">
            <div>
              <span class="meta-label">RECENT</span>
              <div class="recent-list" id="recentList"></div>
            </div>
            <div>
              <span class="meta-label">SAVED</span>
              <div class="recent-list" id="bookmarkList"></div>
            </div>
          </div>
        </div>
      </section>
      <div class="frame-stack" id="frameStack"></div>
      <div class="stage-status" id="stageStatus"></div>
    </main>

    <aside class="side-panel" id="sidePanel" aria-hidden="true">
      <div class="panel-head">
        <div><span class="meta-label" id="panelKicker">PANEL</span><h2 id="panelTitle"></h2></div>
        <button class="panel-close" id="panelClose" type="button"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </div>
</div>

<div class="popover" id="accountPopover" hidden></div>
<div class="toast" id="toast"></div>
</body>
</html>
