<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Bolt</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wdth,wght@90..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bolt.css">
<script defer src="/assets/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="auth-logo"><svg viewBox="0 0 64 64"><path d="M35 7 15 35h14l-3 22 23-32H35Z"/></svg></div>
      <div>
        <div class="auth-name">Bolt</div>
        <p>Private browser workspace.</p>
      </div>
    </section>
    <section class="auth-form-wrap">
      <div class="auth-tabs">
        <button class="active" data-auth-tab="account" type="button">Account</button>
        <button data-auth-tab="pass" type="button">Access code</button>
      </div>
      <form class="auth-form active" id="accountForm" data-auth-form="account">
        <label>Username<input id="loginUsername" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="auth-submit" type="submit">Sign in</button>
      </form>
      <form class="auth-form" id="passForm" data-auth-form="pass">
        <label>Code<input id="accessCode" autocomplete="one-time-code" placeholder="BOLT-..." required></label>
        <button class="auth-submit" type="submit">Enter</button>
      </form>
      <div class="auth-error" id="authError"></div>
    </section>
  </main>
</body>
</html>
