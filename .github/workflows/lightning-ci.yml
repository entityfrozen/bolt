name: Lightning multiplayer checks
on:
  push:
    branches:
      - bolt-hosted-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Lightning
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check app and live scripts
        run: |
          node --check server.js
          node --check private-research.js
          node --check public/assets/research-client.js
          node --check ai-stream.js
          node --check ai-provider.js
          node --check web-search-credentials.js
          node --check public/assets/web-search-settings.js
          node --check public/assets/split-chat.js
          node --check public/assets/apps-v5.js
          node --check public/assets/account-space-ui.js
          node --check public/assets/name-label.js
          node --check account-space.js
          node --check public/assets/account-space-ui.js
          node --check public/assets/community-ui.js
          node --check public/assets/glass-settings.js
          node --check live.js
          node --check community-v2.js
          node --check public/assets/v2.js
          node --check public/assets/workspace-v3.js
          node --check public/assets/app.js
          node --check public/assets/bolt-tools.js
          node --check public/assets/hub.js
          node --check public/assets/study-practice.js
          node --check public/assets/update-log.js
          node --check public/assets/arena-v3.js
          node --check public/assets/world-renderer.js
          node --check public/assets/openfront-port.js
          node --check public/assets/social-v4.js
          node --check public/assets/chat-polish.js
          node --check public/assets/arcade.js
          node --check public/assets/chess-visuals.js
          node --check public/assets/rps-visuals.js
          node --check web-search.js
          node --check public/assets/login.js
          test -f node_modules/marked/lib/marked.umd.js
          test -f node_modules/dompurify/dist/purify.min.js
      - name: Test registration and admin approvals
        run: node --test test/auth.test.mjs
      - name: Test educational portal and access routing
        run: node --test test/learning-portal.test.mjs
      - name: Test signed-in workspace source and live interface hooks
        run: node --test test/workspace-source.test.mjs
      - name: Test study exercises and Prevent Closing preference
        run: node --test test/study-portal.test.mjs
      - name: Test private search URLs and account storage
        run: node --test test/browser-query-privacy.test.mjs
      - name: Test encrypted private results transport
        run: node --test test/private-research.test.mjs
      - name: Test account profiles, DMs and cross-device history
        run: node --test test/account-space.test.mjs
      - name: Test compact nickname labels
        run: node --test test/name-label.test.mjs
      - name: Test persistent admin update log
        run: node --test test/update-log.test.mjs
      - name: Test staff roles and privileged APIs
        run: node --test test/staff-roles.test.mjs
      - name: Test interface copy
        run: node --test test/copy.test.mjs
      - name: Test web search
        run: node --test test/web-search.test.mjs
      - name: Test AI streaming parser
        run: node --test test/ai-stream.test.mjs
      - name: Test AI fallback and roleplay
        run: node --test test/ai-provider.test.mjs
      - name: Test Arcade interface
        run: node --test test/arcade.test.mjs
      - name: Test V2 community servers
        run: node --test test/community-v2.test.mjs
      - name: Test new workspace and puzzle engines
        run: node --test test/workspace-v3.test.mjs
      - name: Test Lightning Live
        run: node --test test/live.test.mjs
      - name: Test click layers and overlays
        run: node --test test/ui-layer.test.mjs
      - name: Test initial browser click handlers
        run: node --test test/ui-init.test.mjs
      - name: Verify hosted Lightning preview
        run: |
          url="https://bolt-v5-preview-production.up.railway.app/assets/bolt-v6.css?ci=${GITHUB_SHA}"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 "$url" | grep -q 'frame-stack{pointer-events:none}'; then
              echo "Hosted preview is serving Lightning multiplayer client."
              exit 0
            fi
            echo "Preview not updated yet; check $attempt/15."
            sleep 6
          done
          echo "Preview did not serve multiplayer client within verification window." >&2
          exit 1
