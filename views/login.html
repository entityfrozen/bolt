<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Lightning — Sign in</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wdth,wght@90..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bolt.css">
<link rel="stylesheet" href="/assets/bolt-v6.css?v=7">
<link rel="stylesheet" href="/assets/login-polish.css?v=1">
<script defer src="/assets/login.js?v=3"></script>
<style>
.auth-pending{display:none;padding:18px 16px;border:1px solid #a9925669;border-radius:8px;background:#221e16;color:#eee4cb;line-height:1.7}.auth-pending.active{display:block}.auth-pending h2{font-size:19px;margin:0 0 7px}.auth-pending p{font-size:12px;color:#c5bbab}.auth-pending button{margin-top:8px;background:#dac38c;color:#241e16;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.auth-hint{font-size:10px;line-height:1.6;color:#969ca1;margin:0}
</style>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="auth-logo"><img src="/assets/lightning-mark.svg?v=1" alt="" class="lightning-mark"></div>
      <div>
        <div class="auth-name">Lightning</div>
        <p>Browse, chat, and play games.</p>
      </div>
      <div class="auth-signature">Made by Amare</div>
    </section>
    <section class="auth-form-wrap">
      <div class="auth-tabs">
        <button class="active" data-auth-tab="account" type="button">Sign in</button>
        <button data-auth-tab="register" type="button">Create account</button>
      </div>
      <form class="auth-form active" id="accountForm" data-auth-form="account">
        <label>Username<input id="loginUsername" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="button" class="auth-show-password" data-password-toggle="loginPassword" aria-pressed="false">Show password</button>
        <button class="auth-submit" type="submit">Sign in</button>
      </form>
      <form class="auth-form" id="registerForm" data-auth-form="register">
        <label>Username<input id="registerUsername" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" required placeholder="Choose your name"></label>
        <label>Password<input id="registerPassword" autocomplete="new-password" type="password" minlength="10" maxlength="128" required></label>
        <label>Confirm password<input id="registerConfirm" autocomplete="new-password" type="password" minlength="10" maxlength="128" required></label><button type="button" class="auth-show-password" data-password-toggle="registerPassword,registerConfirm" aria-pressed="false">Show passwords</button>
        <p class="auth-hint">An admin needs to approve new accounts.</p>
        <button class="auth-submit" type="submit">Request access →</button>
      </form>
      <div id="authPending" class="auth-pending" role="status" aria-live="polite">
        <h2>Request submitted ✓</h2>
        <p>Your account is created but locked until an administrator approves it. Sign in once you receive approval.</p>
        <button id="pendingSignIn" type="button">Return to sign in</button>
      </div>
      <div class="auth-error" id="authError"></div>
    </section>
  </main>
</body>
</html>
