<div class="bolt-shell" id="boltShell">
  <header class="tabbar">
    <button class="bolt-brand" id="homeMark" type="button" title="Lightning — New tab">
      <span class="brand-symbol"><img class="lightning-mark" src="/assets/lightning-mark.svg?v=1" alt="" aria-hidden="true"></span>
      <span class="brand-name">lightning<em>.</em></span>
    </button>
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="newTabBtn" type="button" title="New tab"><svg><use href="#i-plus"/></svg></button>
    <div class="account-zone">
      <span class="role-chip" id="roleChip"></span>
      <button class="account-button" id="accountButton" type="button"><span id="accountInitial">L</span></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="nav-cluster">
      <button class="tool-button" id="backBtn" type="button" title="Back"><svg><use href="#i-back"/></svg></button>
      <button class="tool-button" id="forwardBtn" type="button" title="Forward"><svg><use href="#i-forward"/></svg></button>
      <button class="tool-button" id="reloadBtn" type="button" title="Reload"><svg><use href="#i-reload"/></svg></button>
    </div>
    <form class="address-form" id="addressForm">
      <span class="address-state"><svg><use href="#i-lock"/></svg></span>
      <input id="addressInput" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
      <button class="address-go" type="submit">Go</button>
    </form>
    <button class="tool-button" id="bookmarkBtn" type="button" title="Bookmark"><svg><use href="#i-star"/></svg></button>
    <button class="tool-button" id="menuBtn" type="button" title="Menu"><svg><use href="#i-menu"/></svg></button>
  </div>

  <div class="workarea">
    <nav class="rail">
      <button class="rail-button active" data-action="newtab" type="button" title="Home"><svg><use href="#i-home"/></svg></button>
      <button class="rail-button" data-panel="history" type="button" title="History"><svg><use href="#i-clock"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-button" data-hub="chat" type="button" title="Community chat"><svg><use href="#i-chat"/></svg></button>
      <button class="rail-button" data-hub="games" type="button" title="Multiplayer games"><svg><use href="#i-games"/></svg></button>
      <button class="rail-button" data-hub="updates" type="button" title="Update log"><svg><use href="#i-clock"/></svg></button>
      <button class="rail-button" data-panel="music" type="button" title="Music"><svg><use href="#i-music"/></svg></button>
      <button class="rail-button" data-glass-settings type="button" title="Customize appearance & settings"><svg><use href="#i-settings"/></svg></button>
      <button class="rail-button admin-only" data-panel="admin" type="button" title="Admin"><svg><use href="#i-users"/></svg></button>
    </nav>

    <main class="browser-stage" id="browserStage">
      <section class="newtab v3-browser-home" id="newtabView">
        <div class="v3-browser-dashboard">
          <div class="v3-browser-body">
            <span class="v3-browser-kicker">NEW TAB</span>
            <h1 class="v3-browser-title">New tab.<span>Where to?</span></h1>
            <p class="v3-browser-description">Search the web or open a saved page.</p>
            <form class="newtab-search" id="newtabForm">
              <svg><use href="#i-search"/></svg>
              <input id="newtabInput" autocomplete="off" spellcheck="false" placeholder="Search or enter a web address" aria-label="Search or enter a web address">
              <span class="newtab-keycap">ENTER ↵</span>
            </form>
            <nav class="lightning-shortcuts v3-browser-shortcuts" aria-label="Quick destinations">
              <button type="button" class="lightning-quick" data-hub="overview">⌂ Overview</button>
              <button type="button" class="lightning-quick" data-hub="chat"># Community</button>
              <button type="button" class="lightning-quick" data-hub="games">▣ Arcade</button>
              <button type="button" class="lightning-quick" data-lightning-quick="https://www.google.com/">Google</button>
              <button type="button" class="lightning-quick" data-lightning-quick="https://www.youtube.com/">YouTube</button>
              <button type="button" class="lightning-quick" data-lightning-quick="https://www.wikipedia.org/">Wikipedia</button>
            </nav>
            <button class="newtab-eyebrow lightning-suggest-button v3-browser-suggestion" id="lightningSuggestionButton" type="button" title="Suggest a feature">Suggest a feature</button>
          </div>
          <aside class="v3-browser-sidebar">
            <section class="v3-browser-feature">
              <span>QUICK ACCESS</span>
              <strong>Chats and games</strong>
              <p>Pick up where you left off.</p>
              <button type="button" data-hub="overview">Open home</button>
            </section>
            <section class="v3-browser-guide">
              <strong>OPEN</strong>
              <button type="button" data-hub="chat"><span>#</span> Chat channels</button>
              <button type="button" data-hub="games"><span>▣</span> Games</button>
              <button type="button" data-hub="overview"><span>⌂</span> Home</button>
            </section>
          </aside>
          <div class="v3-browser-history">
            <div><span class="meta-label">RECENT PAGES</span><div class="recent-list" id="recentList"></div></div>
            <div><span class="meta-label">YOUR BOOKMARKS</span><div class="recent-list" id="bookmarkList"></div></div>
          </div>
          <footer class="v3-browser-footer"><span>KEYBOARD SHORTCUTS</span><span>Ctrl+L for address bar · Ctrl+T for new tab</span></footer>
        </div>
      </section>
      <div class="frame-stack" id="frameStack"></div>
      <div id="hubMount" hidden></div>
      <div class="stage-status" id="stageStatus"></div>
    </main>

    <aside class="side-panel" id="sidePanel" aria-hidden="true">
      <div class="panel-head">
        <div><span class="meta-label" id="panelKicker">PANEL</span><h2 id="panelTitle"></h2></div>
        <button class="panel-close" id="panelClose" type="button"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </div>
</div>

<div class="popover" id="accountPopover" hidden></div>
<div class="toast" id="toast"></div>
</body>
</html>
